<style>
/* Ticket-ink palette. Both themes are authored values rather than one being an
   inversion of the other, and every text-on-surface pair was measured against
   WCAG 2.2 AA before being written here. The tightest pair is the small field
   labels, which is why --faint is darker than it looks like it needs to be. */
:root {
  color-scheme: light dark;
  --bg: oklch(0.972 0.008 92);
  --surface: oklch(0.995 0.004 95);
  --sunken: oklch(0.955 0.008 92);
  --ink: oklch(0.20 0.010 55);
  --ink-2: oklch(0.32 0.011 55);
  --muted: oklch(0.46 0.012 58);
  --faint: oklch(0.522 0.012 60);
  --rail: oklch(0.70 0.010 70);
  --line: oklch(0.80 0.012 80);
  --line-soft: oklch(0.88 0.010 82);
  --edge: oklch(0.635 0.014 75);
  --accent: oklch(0.46 0.16 28);
  --accent-ink: oklch(1 0 0);
  --warn: oklch(0.46 0.16 28);
  --unit-ink: oklch(0.46 0.012 58);
  --hover: oklch(0.94 0.008 92);
  --shadow: oklch(0.20 0.010 55 / 0.18);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC",
          "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  --label-space: 0.18em;
}
@media (prefers-color-scheme: dark) {
  :root {
    /* The page is a dark grey rather than black and the card sits a step
       lighter, so depth reads as lightness the way Material's dark theme does. */
    --bg: oklch(0.175 0.006 60);
    --surface: oklch(0.215 0.006 60);
    --sunken: oklch(0.255 0.006 60);
    --ink: oklch(0.93 0.008 88);
    --ink-2: oklch(0.84 0.008 85);
    --muted: oklch(0.68 0.010 80);
    --faint: oklch(0.645 0.012 78);
    --rail: oklch(0.52 0.010 72);
    --line: oklch(0.36 0.008 68);
    --line-soft: oklch(0.30 0.008 66);
    --edge: oklch(0.555 0.012 72);
    /* Saturated colour vibrates on dark surfaces, so the accent gains lightness
       and loses a little chroma rather than staying put. */
    --accent: oklch(0.72 0.15 32);
    --accent-ink: oklch(0.18 0.010 40);
    --warn: oklch(0.76 0.14 40);
    --unit-ink: oklch(0.74 0.008 80);
    --hover: oklch(0.28 0.006 60);
    --shadow: oklch(0 0 0 / 0.5);
  }
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 26px 16px 40px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
@media (min-width: 720px) { body { padding: 52px 32px 64px; } }

main { display: flex; flex-direction: column; gap: 20px; max-width: 780px; margin: 0 auto; }
@media (min-width: 720px) { main { gap: 28px; } }

/* Page-level sharing lives in the header, away from the per-card copy buttons,
   so the two actions are never mistaken for each other. */
.intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.intro-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
h1 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.25; }
@media (min-width: 720px) { h1 { font-size: 29px; } }
.intro p { margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--muted); text-wrap: pretty; }

.mlabel {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: var(--label-space);
  color: var(--faint);
}

/* ---------------------------------------------------------- shared end date */

.panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
@media (min-width: 720px) { .panel { padding: 20px 22px; } }

.field { display: flex; flex-direction: column; gap: 8px; }
.end-row { display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 520px) {
  .end-row { flex-direction: row; align-items: center; }
  .end-row input[type="date"] { flex-grow: 1; }
}

input[type="date"], input[type="text"], button { font: inherit; color: inherit; }

input[type="date"] {
  width: 100%;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--surface);
  /* A date input paints its value in the platform's own format — on a phone
     that is 「2026年8月24日」, whose characters have no monospace face and would
     fall back to a different typeface than the digits. Leaving the body font
     here keeps the native value looking native everywhere. */
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  -webkit-appearance: none;
  appearance: none;
  /* Safari centres a date field's value by making the field itself a flex
     container, which its own stylesheet does. Overriding that with display:block
     is what pushed the value against the top of the field on iPhone while
     desktop Chrome still looked right, so the flex context is kept — as flex
     rather than the inline-flex Safari uses, so the field stays block-level and
     cannot pick up a stray gap beneath it in a non-flex parent. */
  display: flex;
}
input[type="date"]::-webkit-date-and-time-value {
  /* Safari centres the value horizontally by default, and collapses this inner
     box to nothing when the field has no value. The first line fixes the
     alignment; the height holds an empty field open. The em value is a fallback
     for engines without the line-height unit. */
  text-align: left;
  margin: 0;
  min-height: 1.5em;
  min-height: 1lh;
}
input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }

.btn {
  min-height: 46px;
  padding: 0 16px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--surface);
  font-size: 15px;
  cursor: pointer;
  white-space: nowrap;
}
.btn-share {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  min-height: 40px;
  padding: 0 13px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--surface);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.btn-quiet {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: none;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
}
.btn-quiet.is-done { color: var(--accent); }
.btn-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 46px;
  padding: 0 16px;
  border: 1px dashed var(--edge);
  border-radius: var(--radius);
  background: none;
  font-size: 15px;
  color: var(--accent);
  cursor: pointer;
}
@media (hover: hover) {
  .btn:hover, .btn-add:hover, .btn-share:hover { border-color: var(--accent); color: var(--accent); }
  .btn-quiet:hover { color: var(--ink); border-color: var(--line); }
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.check {
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 34px;
  padding-top: 12px;
  border-top: 1px dashed var(--line-soft);
  font-size: 15px;
  cursor: pointer;
}
.check input { width: 19px; height: 19px; flex-shrink: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
.check-note { color: var(--muted); font-size: 13.5px; }

/* --------------------------------------------------------------- the ticket */

.starts { display: flex; flex-direction: column; gap: 10px; }
.cards { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }

/* The slot exists so the ticket itself can clip its notches with overflow while
   the options menu, anchored to the same corner, stays free to open past the
   card's edge. */
.card-slot { position: relative; }

/* The stub sits above the body on a narrow screen and beside it once there is
   room, so the perforation runs across the ticket on a phone and down it on a
   desktop. overflow:hidden is what turns the notch circles into half-round
   bites out of the card edge. */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.stub {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 15px;
  padding-right: 50px;
  background: var(--sunken);
}
.pair { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.perf { position: relative; height: 0; border-top: 1px dashed var(--rail); }
.perf::before, .perf::after {
  content: "";
  position: absolute;
  top: -7px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rail);
}
.perf::before { left: -7px; }
.perf::after { right: -7px; }

.main { display: flex; flex-direction: column; gap: 8px; padding: 13px 15px 12px; }

@media (min-width: 620px) {
  .card { flex-direction: row; align-items: stretch; }
  .stub { width: 208px; flex-shrink: 0; padding-right: 15px; justify-content: space-between; }
  .perf {
    width: 0;
    height: auto;
    border-top: none;
    border-left: 1px dashed var(--rail);
    flex-shrink: 0;
  }
  .perf::before { top: -7px; left: -6px; }
  .perf::after { top: auto; bottom: -7px; left: -6px; right: auto; }
  .main { flex-grow: 1; min-width: 0; padding: 15px 50px 14px 18px; justify-content: center; }
}

/* The name reads as a heading until hovered or focused, then shows its edges so
   it is clearly a field you can retype. */
.name {
  width: 100%;
  min-height: 36px;
  padding: 0 8px;
  margin-left: -8px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: none;
  font-size: 15.5px;
  font-weight: 600;
}
@media (hover: hover) { .name:hover { border-color: var(--edge); } }
.name:focus { border-color: var(--accent); }
.name::placeholder { font-weight: 400; color: var(--faint); }

/* ------------------------------------------------------------- the headline */

/* The copy button sits on the answer's baseline, immediately to its right, and
   drops to the next line only when the figure has taken the whole width. */
.answer { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 6px 14px; }

.figure {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0.4em;
  margin: 0;
  line-height: 1.05;
}
/* Each number and its unit is one unbreakable pair, so a narrow screen can only
   break between pairs and never between a digit and the character that gives it
   meaning. */
.figure .p { white-space: nowrap; font-size: clamp(2.1rem, 10.5vw, 3.1rem); }
.figure .n {
  font-family: var(--mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
/* Unit characters at roughly half the digit size: large enough to read, small
   enough that the digits carry the line. The left margin is the quarter-em gap
   Chinese typography asks for between Han characters and Western numerals. */
.figure .u {
  font-size: 0.52em;
  font-weight: 500;
  color: var(--muted);
  margin-left: 0.22em;
}

.total { margin: 0; font-size: 13px; color: var(--muted); }
.total .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--warn); }
.note:empty { display: none; }

/* --------------------------------------------------------- the options menu */

.menu-wrap { position: absolute; top: 8px; right: 8px; }
.menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: none;
  color: var(--muted);
  cursor: pointer;
}
@media (hover: hover) { .menu-btn:hover { color: var(--ink); border-color: var(--edge); } }
.menu-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--edge); background: var(--surface); }

.menu {
  position: absolute;
  top: 38px;
  right: 0;
  z-index: 20;
  min-width: 168px;
  padding: 5px;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  box-shadow: 0 6px 20px var(--shadow);
}
.menu[hidden] { display: none; }
.menu-label {
  margin: 0;
  padding: 6px 9px 5px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: var(--label-space);
  color: var(--faint);
}
.menu button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 0 9px;
  border: none;
  border-radius: 3px;
  background: none;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}
@media (hover: hover) { .menu button:hover { background: var(--hover); } }
.menu button[aria-checked="true"] { font-weight: 600; }
.menu .tick { flex-shrink: 0; color: var(--accent); visibility: hidden; }
.menu button[aria-checked="true"] .tick { visibility: visible; }
.menu-sep { height: 1px; margin: 5px 4px; background: var(--line-soft); }
.menu-danger { color: var(--accent); }
.menu-danger[hidden] { display: none; }

/* Removing a ticket asks first, in place, rather than through a browser dialog
   that would blank out the page behind it. */
.menu-confirm { padding: 4px 5px 2px; }
.menu-confirm[hidden] { display: none; }
.menu-confirm p { margin: 0 0 7px; padding: 0 4px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.menu-confirm .row { display: flex; gap: 6px; }
.menu-confirm button { min-height: 34px; justify-content: center; font-size: 13px; }
.menu-confirm .yes { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.menu-confirm .no { border: 1px solid var(--edge); }

/* ------------------------------------------------------------ share dialog */

dialog.sheet {
  width: min(100% - 24px, 22rem);
  max-height: calc(100dvh - 32px);
  padding: 0;
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  overflow: auto;
}
dialog.sheet::backdrop { background: oklch(0.2 0.01 55 / 0.5); }
.sheet-inner { display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 20px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-hint { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.sheet-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  margin: -5px -5px 0 0;
  border: 1px solid transparent;
  border-radius: 4px;
  background: none;
  color: var(--muted);
  cursor: pointer;
}
@media (hover: hover) { .sheet-close:hover { color: var(--ink); border-color: var(--edge); } }

/* A QR code is a physical artefact, not a themed surface: it stays ink on paper
   in both themes, quiet zone included, because a fair number of scanners will
   not read an inverted code. */
.qr-plate {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.qr-plate img { display: block; width: 100%; height: auto; max-width: 292px; image-rendering: pixelated; }
.qr-plate p { margin: 0; padding: 28px 10px; font-size: 13px; line-height: 1.6; color: #333333; text-align: center; }

.link-row { display: flex; gap: 8px; }
.link-row input {
  flex-grow: 1;
  min-width: 0;
  min-height: 42px;
  padding: 0 10px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--sunken);
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-2);
}
.link-row button {
  flex-shrink: 0;
  min-height: 42px;
  padding: 0 12px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--surface);
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.sheet-actions { display: flex; flex-direction: column; gap: 8px; }
.sheet-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--surface);
  font-size: 15px;
  cursor: pointer;
}
.sheet-actions button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.sheet-actions button[hidden] { display: none; }
@media (hover: hover) {
  .link-row button:hover, .sheet-actions button:hover { border-color: var(--accent); }
}

footer { font-size: 12.5px; line-height: 1.75; color: var(--faint); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>

<main>
  <div class="intro">
    <div class="intro-text">
      <h1>天數計算機</h1>
      <p>輸入起算日與結束日，算出相差幾週幾天、幾個月幾天與總天數。</p>
    </div>
    <button type="button" class="btn-share" id="share">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2m0 0L5.2 4.8M8 2l2.8 2.8M3 9.2v3.3a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5V9.2"></path></svg>
      <span>分享</span>
    </button>
  </div>

  <section class="panel" aria-labelledby="end-label">
    <div class="field">
      <span class="mlabel" id="end-label">結束日</span>
      <div class="end-row">
        <input type="date" id="to" value="" aria-labelledby="end-label">
        <button type="button" class="btn" id="today" aria-label="將結束日設為今天">設為今天</button>
      </div>
    </div>

    <label class="check" for="inclusive">
      <input type="checkbox" id="inclusive">
      <span>含結束日<span class="check-note">（多算 1 天）</span></span>
    </label>
  </section>

  <section class="starts" aria-labelledby="start-label">
    <span class="mlabel" id="start-label">起算日</span>

    <!-- The first ticket is written out here rather than built in script: the
         fields still exist if scripting is off or has not run yet, and this
         markup doubles as the template every further ticket is cloned from. -->
    <ul class="cards" id="cards">
      <li class="card-slot">

    // The constructor silently rolls 2026-02-30 over into March, so check that
    // the parts survived the round trip.
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return dt;
  }

  function toYMD(d) {
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function today() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  // Whole days between two local-midnight dates. Rounding absorbs the 23-hour
  // and 25-hour days that daylight saving produces where it is observed.
  function daysBetween(a, b) {
    return Math.round((b.getTime() - a.getTime()) / MS_PER_DAY);
  }

  // Advance by whole calendar months, clamping to the last day of the target
  // month when that month is shorter than the source day, so 2026-01-31 plus one
  // month is 2026-02-28 rather than spilling over into March.
  function addMonths(date, n) {
    var probe = new Date(date.getFullYear(), date.getMonth() + n, 1);
    var lastDay = new Date(probe.getFullYear(), probe.getMonth() + 1, 0).getDate();
    return new Date(probe.getFullYear(), probe.getMonth(), Math.min(date.getDate(), lastDay));
  }

  function computeSpan(fromDate, toDate, inclusive) {
    var reversed = toDate.getTime() < fromDate.getTime();
    var start = reversed ? toDate : fromDate;
    var end = reversed ? fromDate : toDate;
    var totalDays = daysBetween(start, end) + (inclusive ? 1 : 0);
    var months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
    if (end.getDate() < start.getDate()) months -= 1;
    if (months < 0) months = 0;
    var anchor = addMonths(start, months);
    return {
      reversed: reversed,
      totalDays: totalDays,
      weeks: Math.floor(totalDays / 7),
      weekDays: totalDays % 7,
      months: months,
      monthDays: daysBetween(anchor, end),
      years: Math.floor(months / 12),
      yearMonths: months % 12,
      start: toYMD(start),
      end: toYMD(end)
    };
  }

  // The chosen unit decides which pairs the headline shows. A span of a year or
  // more rolls the month figure up into years, months and days rather than
  // reporting an unreadable month count.
  function figureParts(span, unit) {
    if (unit === 'week') return [[span.weeks, '週'], [span.weekDays, '天']];
    if (unit === 'day') return [[span.totalDays, '天']];
    if (span.months >= 12) {
      return [[span.years, '年'], [span.yearMonths, '個月'], [span.monthDays, '天']];
    }
    return [[span.months, '個月'], [span.monthDays, '天']];
  }

  function partsText(parts) {
    return parts.map(function (p) { return p[0] + ' ' + p[1]; }).join(' ');
  }

  // ==========================================================================
  // State
  // ==========================================================================

  var state = {
    to: toYMD(today()),
    // True while the end date should keep meaning "today". Picking a specific
    // end date turns it off, so that choice is what comes back tomorrow; the
    // 設為今天 button turns it on again.
    toFollowsToday: true,
    inclusive: false,
    rows: []
  };
  var nextId = 1;

  function makeRow(name, from, unit) {
    return {
      id: 'r' + (nextId++),
      name: name,
      from: from,
      unit: UNITS.indexOf(unit) >= 0 ? unit : DEFAULT_UNIT
    };
  }
  function defaultName(index) {
    return index === 0 ? '起算日' : '起算日 ' + (index + 1);
  }

  // localStorage throws outright in some privacy modes and on some file:// URLs,
  // and setItem throws once the quota is full. The tool has to stay usable with
  // storage silently unavailable, so every access is guarded.
  function safeGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* unavailable */ }
  }

  function loadStored() {
    var raw = safeGet(STORE_KEY);
    if (!raw) return;
    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    if (!data || typeof data !== 'object') return;
    if (typeof data.inclusive === 'boolean') state.inclusive = data.inclusive;
    if (data.toFollowsToday === false && parseYMD(data.to)) {
      state.to = data.to;
      state.toFollowsToday = false;
    }
    if (Object.prototype.toString.call(data.rows) === '[object Array]') {
      var rows = [];
      for (var i = 0; i < data.rows.length && rows.length < MAX_ROWS; i++) {
        var r = data.rows[i];
        if (!r || !parseYMD(r.from)) continue;
        rows.push(makeRow(
          typeof r.name === 'string' ? r.name.slice(0, 40) : defaultName(rows.length),
          r.from, r.unit
        ));
      }
      if (rows.length) state.rows = rows;
    }
  }

  function save() {
    safeSet(STORE_KEY, JSON.stringify({
      v: 2,
      to: state.to,
      toFollowsToday: state.toFollowsToday,
      inclusive: state.inclusive,
      rows: state.rows.map(function (r) {
        return { name: r.name, from: r.from, unit: r.unit };
      })
    }));
  }

  // Query parameters override anything remembered, so a shared link always shows
  // the receiver what the sender saw. "from", "unit" and "name" may repeat, one
  // per start date, and are matched up by position.
  function applyQuery() {
    var params;
    try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
    var froms = params.getAll('from').filter(function (v) { return parseYMD(v); });
    if (froms.length) {
      var units = params.getAll('unit');
      var names = params.getAll('name');
      state.rows = froms.slice(0, MAX_ROWS).map(function (v, i) {
        var given = typeof names[i] === 'string' ? names[i].trim().slice(0, 40) : '';
        return makeRow(given || defaultName(i), v, units[i]);
      });
    }
    if (parseYMD(params.get('to'))) {
      state.to = params.get('to');
      state.toFollowsToday = false;
    }
    if (params.has('inclusive')) state.inclusive = params.get('inclusive') !== '0';
  }

  function buildQuery() {
    var params = new URLSearchParams();
    state.rows.forEach(function (r) { params.append('from', r.from); });
    state.rows.forEach(function (r) { params.append('unit', r.unit); });
    // A row still carrying the name the page generated for it contributes an
    // empty value rather than repeating a label the receiving page would have
    // produced anyway, and the whole list is left out until something is
    // actually named. Chinese characters cost nine characters each once
    // percent-encoded, so an untouched page keeps a short link.
    var names = state.rows.map(function (r, i) {
      return r.name === defaultName(i) ? '' : r.name;
    });
    if (names.some(function (n) { return n; })) {
      names.forEach(function (n) { params.append('name', n); });
    }
    params.set('to', state.to);
    if (state.inclusive) params.set('inclusive', '1');
    return params.toString();
  }

  // Opening the page from a file:// URL makes replaceState throw a SecurityError,
  // so the whole write-back is optional.
  function syncUrl() {
    try {
      window.history.replaceState(null, '', window.location.pathname + '?' + buildQuery());
    } catch (e) { /* this document is not addressable */ }
  }

  // A file:// path means nothing to anyone else, so a link shared from a local
  // copy points at the published page carrying the same state.
  function shareUrl() {
    var query = buildQuery();
    if (window.location.protocol === 'file:') return CANONICAL + '?' + query;
    return window.location.origin + window.location.pathname + '?' + query;
  }

  // ==========================================================================
  // View
  // ==========================================================================

  var cardsEl = document.getElementById('cards');
  var toEl = document.getElementById('to');
  var inclusiveEl = document.getElementById('inclusive');
  var addEl = document.getElementById('add');
  var liveEl = document.getElementById('live');

  // Capture the ticket written into the document before touching it, and clone
  // that for every row, so the markup lives in one place rather than half in
  // HTML and half in createElement calls.
  var CARD_TEMPLATE = cardsEl.innerHTML;
  var views = [];
  var openMenu = null;

  function buildCard(row, index) {
    var scratch = document.createElement('ul');
    scratch.innerHTML = CARD_TEMPLATE;
    var li = scratch.firstElementChild;

    var view = {
      row: row,
      li: li,
      name: li.querySelector('.name'),
      date: li.querySelector('.date'),
      figure: li.querySelector('.js-figure'),
      total: li.querySelector('.js-total'),
      note: li.querySelector('.js-note'),
      copy: li.querySelector('.js-copy'),
      copyLabel: li.querySelector('.js-copy-label'),
      menuBtn: li.querySelector('.js-menu-btn'),
      menu: li.querySelector('.js-menu'),
      unitBtns: [].slice.call(li.querySelectorAll('.js-unit')),
      remove: li.querySelector('.js-remove'),
      confirm: li.querySelector('.js-confirm'),
      confirmText: li.querySelector('.js-confirm-text'),
      confirmYes: li.querySelector('.js-confirm-yes'),
      confirmNo: li.querySelector('.js-confirm-no'),
      copyTimer: 0,
      summary: '',
      copyText: ''
    };

    view.name.value = row.name;
    view.date.value = row.from;
    // Only the first field keeps the id, so the page always has one stable
    // handle on the primary start date and no id is ever duplicated.
    view.date.removeAttribute('id');
    if (index === 0) view.date.id = 'from';

    view.name.addEventListener('input', function () {
      row.name = view.name.value;
      labelRow(view);
      // The summary a screen reader reads back is built from the name, so it has
      // to be rebuilt when the name changes.
      recalc(view);
      save();
      syncUrl();
    });
    view.date.addEventListener('input', function () {
      row.from = view.date.value;
      recalc(view);
      save();
      syncUrl();
    });
    view.copy.addEventListener('click', function () { copyRow(view); });

    view.menuBtn.addEventListener('click', function () {
      if (view.menu.hidden) showMenu(view); else hideMenu(view);
    });
    view.menuBtn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        showMenu(view, e.key === 'ArrowUp' ? 'last' : 'first');
      }
    });
    view.menu.addEventListener('keydown', function (e) { onMenuKey(view, e); });
    view.unitBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        pickUnit(view, btn.getAttribute('data-unit'));
        hideMenu(view, true);
      });
    });
    view.remove.addEventListener('click', function () { askRemove(view); });
    view.confirmNo.addEventListener('click', function () {
      cancelRemove(view);
      view.remove.focus();
    });
    view.confirmYes.addEventListener('click', function () { removeRow(row.id); });

    applyUnit(view);
    labelRow(view);
    return view;
  }

  function applyUnit(view) {
    view.unitBtns.forEach(function (btn) {
      btn.setAttribute('aria-checked', btn.getAttribute('data-unit') === view.row.unit ? 'true' : 'false');
    });
  }

  function pickUnit(view, unit) {
    if (UNITS.indexOf(unit) < 0 || view.row.unit === unit) return;
    view.row.unit = unit;
    applyUnit(view);
    recalc(view);
    announce(view.summary);
    save();
    syncUrl();
  }

  // Every ticket has its own date field, options menu, copy button and remove
  // action, so each needs an accessible name saying which row it belongs to.
  function labelRow(view) {
    var label = view.row.name.trim() || '未命名';
    view.date.setAttribute('aria-label', '起算日：' + label);
    view.copy.setAttribute('aria-label', '複製結果：' + label);
    view.menuBtn.setAttribute('aria-label', '選項：' + label);
    view.menu.setAttribute('aria-label', '選項：' + label);
    view.remove.setAttribute('aria-label', '移除起算日：' + label);
    view.confirmText.textContent = '確定要移除「' + label + '」嗎？';
  }

  function menuItems(view) {
    return [].slice.call(view.menu.querySelectorAll('button')).filter(function (b) {
      return !b.hidden && b.offsetParent !== null;
    });
  }

  function showMenu(view, focus) {
    if (openMenu && openMenu !== view) hideMenu(openMenu);
    cancelRemove(view);
    view.menu.hidden = false;
    view.menuBtn.setAttribute('aria-expanded', 'true');
    openMenu = view;
    var items = menuItems(view);
    if (focus === 'last') items[items.length - 1].focus();
    else if (focus === 'first') items[0].focus();
  }

  function hideMenu(view, refocus) {
    if (!view || view.menu.hidden) return;
    view.menu.hidden = true;
    view.menuBtn.setAttribute('aria-expanded', 'false');
    cancelRemove(view);
    if (openMenu === view) openMenu = null;
    if (refocus) view.menuBtn.focus();
  }

  function onMenuKey(view, e) {
    var items = menuItems(view);
    var at = items.indexOf(document.activeElement);
    if (e.key === 'Escape') {
      e.preventDefault();
      hideMenu(view, true);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      items[(at + 1 + items.length) % items.length].focus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      items[(at - 1 + items.length) % items.length].focus();
    } else if (e.key === 'Home') {
      e.preventDefault();
      items[0].focus();
    } else if (e.key === 'End') {
      e.preventDefault();
      items[items.length - 1].focus();
    } else if (e.key === 'Tab') {
      hideMenu(view);
    }
  }

  function askRemove(view) {
    if (state.rows.length < 2) {
      announce('只剩一個起算日，無法移除。');
      return;
    }
    view.remove.hidden = true;
    view.confirm.hidden = false;
    view.confirmYes.focus();
  }

  function cancelRemove(view) {
    if (!view.confirm.hidden) {
      view.confirm.hidden = true;
      view.remove.hidden = state.rows.length < 2;
    }
  }

  function render() {
    views.forEach(function (v) { if (v.copyTimer) clearTimeout(v.copyTimer); });
    openMenu = null;
    cardsEl.textContent = '';
    views = state.rows.map(buildCard);
    views.forEach(function (v) {
      // Nothing to remove when there is only one start date left.
      v.remove.hidden = state.rows.length < 2;
      cardsEl.appendChild(v.li);
    });
    recalcAll();
  }

  function recalc(view) {
    var from = parseYMD(view.row.from);
    var to = parseYMD(state.to);

    if (!from || !to) {
      view.figure.textContent = '—';
      view.total.textContent = from ? '請選擇結束日。' : '請選擇起算日。';
      view.note.textContent = '';
      view.summary = '';
      view.copyText = '';
      return;
    }

    var span = computeSpan(from, to, state.inclusive);
    var parts = figureParts(span, view.row.unit);

    view.figure.textContent = '';
    parts.forEach(function (p) {
      var pair = document.createElement('span');
      pair.className = 'p';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = p[0];
      var u = document.createElement('span');
      u.className = 'u';
      u.textContent = p[1];
      pair.appendChild(n);
      pair.appendChild(u);
      view.figure.appendChild(pair);
    });

    view.total.textContent = '';
    view.total.appendChild(document.createTextNode('共 '));
    var v = document.createElement('span');
    v.className = 'v';
    v.textContent = span.totalDays;
    view.total.appendChild(v);
    view.total.appendChild(document.createTextNode(
      ' 天' + (state.inclusive ? '（含結束日）' : '')
    ));

    view.note.textContent = span.reversed ? '結束日早於起算日，已自動對調計算。' : '';

    var text = partsText(parts);
    view.summary = (view.row.name.trim() || '起算日') + '：' + text + '，共 ' + span.totalDays + ' 天';
    view.copyText = text + ' ／ 共 ' + span.totalDays + ' 天';
  }

  function recalcAll() { views.forEach(recalc); }

  // One polite live region for the whole page, on a short delay. Announcing every
  // line of every ticket on each keystroke would bury the answer.
  var announceTimer = 0;
  function announce(text) {
    if (!text) return;
    if (announceTimer) clearTimeout(announceTimer);
    announceTimer = setTimeout(function () { liveEl.textContent = text; }, 400);
  }

  function announceAll() {
    var parts = views.slice(0, 4).map(function (v) { return v.summary; })
      .filter(function (s) { return s; });
    if (views.length > 4) parts.push('其餘 ' + (views.length - 4) + ' 筆未讀出');
    announce(parts.join('，'));
  }

  // ==========================================================================
  // Actions
  // ==========================================================================

  function addRow() {
    if (state.rows.length >= MAX_ROWS) return;
    state.rows.push(makeRow(defaultName(state.rows.length), DEFAULT_FROM, DEFAULT_UNIT));
    render();
    save();
    syncUrl();
    var last = views[views.length - 1];
    if (last) last.name.focus();
  }

  function removeRow(id) {
    if (state.rows.length < 2) return;
    var gone = null;
    state.rows = state.rows.filter(function (r) {
      if (r.id === id) { gone = r; return false; }
      return true;
    });
    render();
    save();
    syncUrl();
    announce('已移除起算日：' + ((gone && gone.name.trim()) || '未命名'));
    addEl.focus();
  }

  // writeText needs a secure context. Double-clicking the file counts as one, but
  // plain-HTTP hosting on a local network does not, so the old selection-based
  // copy stays as a fallback rather than leaving the button dead.
  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error('copy unavailable'));
    });
  }

  var labelTimers = {};
  function flashLabel(el, key, label, restore) {
    if (labelTimers[key]) clearTimeout(labelTimers[key]);
    el.textContent = label;
    labelTimers[key] = setTimeout(function () {
      el.textContent = restore;
      labelTimers[key] = 0;
    }, 2000);
  }

  function copyRow(view) {
    if (!view.copyText) return;
    var text = view.copyText;
    var key = 'copy-' + view.row.id;
    writeClipboard(text).then(function () {
      view.copy.classList.add('is-done');
      flashLabel(view.copyLabel, key, '已複製', '複製結果');
      setTimeout(function () { view.copy.classList.remove('is-done'); }, 2000);
      announce('已複製：' + text);
    }, function () {
      flashLabel(view.copyLabel, key, '複製失敗', '複製結果');
      announce('複製失敗，請手動選取文字。');
    });
  }

  // ==========================================================================
  // Sharing
  // ==========================================================================

  var dialog = document.getElementById('share-dialog');
  var qrPlate = document.getElementById('qr-plate');
  var shareUrlEl = document.getElementById('share-url');
  var copyLinkBtn = document.getElementById('copy-link');
  var downloadBtn = document.getElementById('download-qr');
  var downloadLabel = document.getElementById('download-qr-label');
  var systemShareBtn = document.getElementById('system-share');
  var qrState = { url: null, objectUrl: null, matrix: null };

  function paintQR(ctx, matrix, scale, quiet) {
    ctx.fillStyle = '#000000';
    for (var y = 0; y < matrix.size; y++) {
      for (var x = 0; x < matrix.size; x++) {
        if (matrix.modules[y][x]) {
          ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
        }
      }
    }
  }

  function releaseQR() {
    if (qrState.objectUrl) {
      URL.revokeObjectURL(qrState.objectUrl);
      qrState.objectUrl = null;
    }
  }

  function renderQR(url) {
    qrPlate.textContent = '';
    qrState.matrix = null;
    releaseQR();

    var matrix;
    try {
      matrix = QR.encode(url);
    } catch (e) {
      var msg = document.createElement('p');
      msg.textContent = '連結太長，無法產生 QR 圖片。請改用「複製連結」。';
      qrPlate.appendChild(msg);
      downloadBtn.disabled = true;
      return;
    }
    downloadBtn.disabled = false;
    qrState.matrix = matrix;

    // Integer pixels per module only. A fractional scale makes the browser
    // resample the bitmap, which smears the module edges and is exactly what
    // makes a rendered QR code fail to scan.
    var scale = 8, quiet = 4;
    var dim = (matrix.size + quiet * 2) * scale;
    var canvas = document.createElement('canvas');
    canvas.width = dim;
    canvas.height = dim;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, dim, dim);
    paintQR(ctx, matrix, scale, quiet);

    // Shown as an image rather than a live canvas so a long press offers "save
    // image", which is the only way to keep the code in the in-app browsers
    // that ignore a download link.
    var img = document.createElement('img');
    img.alt = '這個頁面網址的 QR 圖片';
    img.width = dim;
    img.height = dim;
    canvas.toBlob(function (blob) {
      if (!blob) { img.src = canvas.toDataURL('image/png'); return; }
      qrState.objectUrl = URL.createObjectURL(blob);
      img.src = qrState.objectUrl;
    }, 'image/png');
    qrPlate.appendChild(img);
  }

  function openShare() {
    var url = shareUrl();
    qrState.url = url;
    shareUrlEl.value = url;
    renderQR(url);
    systemShareBtn.hidden = !navigator.share;
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  }

  function closeShare() {
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }

  function qrFilename() {
    var first = state.rows[0];
    return 'date-span_' + ((first && first.from) || toYMD(today())) + '_qr.png';
  }

  // The saved image carries the quiet zone and a caption, so a printed or
  // forwarded copy still says where it leads.
  function buildQRFile(cb) {
    if (!qrState.matrix) { cb(null); return; }
    var scale = 12, quiet = 4;
    var qrDim = (qrState.matrix.size + quiet * 2) * scale;
    var caption = 96;
    var canvas = document.createElement('canvas');
    canvas.width = qrDim;
    canvas.height = qrDim + caption;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    paintQR(ctx, qrState.matrix, scale, quiet);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#111111';
    ctx.font = '600 34px -apple-system, "PingFang TC", "Noto Sans TC", sans-serif';
    ctx.fillText('天數計算機', canvas.width / 2, qrDim + 6);
    ctx.fillStyle = '#555555';
    ctx.font = '24px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('days.runawayup.com', canvas.width / 2, qrDim + 52);
    canvas.toBlob(function (blob) { cb(blob); }, 'image/png');
  }

  function downloadQR() {
    buildQRFile(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = qrFilename();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      flashLabel(downloadLabel, 'dl', '已儲存', '下載 QR 圖片');
    });
  }

  document.getElementById('share').addEventListener('click', openShare);
  document.getElementById('share-close').addEventListener('click', closeShare);
  dialog.addEventListener('close', releaseQR);
  dialog.addEventListener('click', function (e) {
    // A modal dialog's backdrop counts as a click on the dialog element itself,
    // so this only closes when the point lands outside the panel's own box.
    if (e.target !== dialog) return;
    var r = dialog.getBoundingClientRect();
    var inside = e.clientX >= r.left && e.clientX <= r.right &&
                 e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) closeShare();
  });

  shareUrlEl.addEventListener('focus', function () { shareUrlEl.select(); });

  copyLinkBtn.addEventListener('click', function () {
    writeClipboard(qrState.url || shareUrl()).then(function () {
      flashLabel(copyLinkBtn, 'link', '已複製', '複製連結');
    }, function () {
      flashLabel(copyLinkBtn, 'link', '請手動複製', '複製連結');
      shareUrlEl.focus();
    });
  });

  downloadBtn.addEventListener('click', downloadQR);

  // share() needs the user gesture it was called from, so it is invoked straight
  // out of the handler rather than after any await.
  systemShareBtn.addEventListener('click', function () {
    if (!navigator.share) return;
    navigator.share({
      title: '天數計算機',
      url: qrState.url || shareUrl()
    }).catch(function () { /* the sheet was dismissed */ });
  });

  // ==========================================================================
  // Boot
  // ==========================================================================

  loadStored();
  applyQuery();
  if (!state.rows.length) state.rows = [makeRow(defaultName(0), DEFAULT_FROM, DEFAULT_UNIT)];
  if (state.toFollowsToday) state.to = toYMD(today());

  toEl.value = state.to;
  inclusiveEl.checked = state.inclusive;
  render();
  syncUrl();

  toEl.addEventListener('input', function () {
    state.to = toEl.value;
    state.toFollowsToday = false;
    recalcAll();
    save();
    syncUrl();
  });

  document.getElementById('today').addEventListener('click', function () {
    state.to = toYMD(today());
    state.toFollowsToday = true;
    toEl.value = state.to;
    recalcAll();
    announceAll();
    save();
    syncUrl();
  });

  inclusiveEl.addEventListener('change', function () {
    state.inclusive = inclusiveEl.checked;
    recalcAll();
    announceAll();
    save();
    syncUrl();
  });

  addEl.addEventListener('click', addRow);

  document.addEventListener('click', function (e) {
    if (!openMenu) return;
    if (openMenu.li.contains(e.target)) return;
    hideMenu(openMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openMenu) hideMenu(openMenu, true);
  });
})();
</script>
</body>
</html>
